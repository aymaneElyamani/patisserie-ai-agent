[project]
name = "server"
version = "0.1.0"
description = "FastAPI backend for the pâtisserie chatbot"
readme = "README.md"
authors = [
    { name = "Mohamed Aassou", email = "mohamedaassou12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.2",
    "openai>=2.0.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.47",
]

[project.scripts]
server = "server.main:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
